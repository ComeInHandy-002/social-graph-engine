<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SocialGraph Pro — 社交网络可视分析中枢，支持 10 种图分析算法与交互式 3D 可视化">
  <title>SocialGraph Pro | 社交网络可视分析中枢</title>

  <!-- Preconnect to CDN origins for faster resource loading -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Critical CSS (inline for LCP) -->
  <style>
    /* 关键渲染路径: 确保加载屏幕立即可见, 避免 CLS */
    html,body{height:100%;overflow:hidden;}
    body{background:radial-gradient(circle at center,#0a0a1a 0%,#000005 100%);color:#eee;font-family:'Segoe UI',Tahoma,sans-serif;}

    /* 3D 画布容器预留空间, 防止 CLS */
    #graph{position:fixed;inset:0;z-index:0;width:100vw;height:100vh;}

    /* 加载屏幕内联样式 */
    #loading-screen{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;}
    .spinner{width:50px;height:50px;border:3px solid rgba(0,255,136,0.3);border-top-color:#00ff88;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    #loading-text{color:#00ff88;font-size:18px;letter-spacing:2px;text-align:center;line-height:1.5;}

    /* 跳过导航链接 */
    .skip-link{position:absolute;top:-100%;left:12px;background:#00ff88;color:#000;padding:8px 12px;border-radius:4px;z-index:10001;font-weight:bold;transition:top 0.3s;}
    .skip-link:focus{top:12px;}
  </style>

  <!-- CSS 文件 (defer 加载非关键 CSS) -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dark-theme.css">

  <link rel="preload" href="https://unpkg.com/3d-force-graph@1.73.0/dist/3d-force-graph.js" as="script">
  <link rel="preload" href="js/chart.umd.min.js" as="script">

  <!-- 3d-force-graph (CDN, 核心渲染库) -->
  <script src="https://unpkg.com/3d-force-graph@1.73.0/dist/3d-force-graph.js"></script>
  <!-- Chart.js (本地文件, 统计仪表板) -->
  <script src="js/chart.umd.min.js"></script>
</head>

<body>
  <!-- 跳过导航 (WCAG) -->
  <a href="#main-content" class="skip-link">跳到主要内容</a>

  <!-- 无障碍通知区域 (屏幕阅读器) -->
  <div id="a11y-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- 加载遮罩 -->
  <div id="loading-screen" role="status" aria-label="加载中">
    <div class="spinner" aria-hidden="true"></div>
    <div id="loading-text">系统休眠中...</div>
    <div id="loading-progress" style="display:none; margin-top:12px; color:#888; font-size:11px;"></div>
  </div>

  <!-- 全局搜索 -->
  <div id="search-container" role="search" aria-label="全局节点搜索">
    <input
      id="global-search"
      type="search"
      placeholder="搜索节点 ID..."
      autocomplete="off"
      aria-label="搜索节点 ID"
      aria-autocomplete="list"
      aria-controls="search-results"
      role="combobox"
      aria-expanded="false">
    <div id="search-results" role="listbox" aria-label="搜索结果"></div>
  </div>

  <!-- 侧边栏导航 -->
  <nav id="side-bar" aria-label="控制面板">
    <h3>社交引擎控制台</h3>

    <button class="btn-load" id="btn-load" aria-label="载入核心数据集 (快捷键 L)">载入核心数据集</button>

    <div id="timeline-panel" style="display:none; background:rgba(0,0,0,0.4); padding:12px; border-radius:8px; margin-top:10px; margin-bottom:15px; border:1px solid rgba(0,255,136,0.2);" role="region" aria-label="宇宙膨胀时间轴">
      <div style="font-size:12px; color:#00ff88; margin-bottom:8px; text-align:center; font-weight:bold; letter-spacing:1px;">宇宙膨胀时间轴</div>
      <div style="display:flex; gap:10px; align-items:center;">
        <button id="btn-play" style="width:40px; padding:5px; margin:0; background:linear-gradient(45deg,#0055ff,#0088ff);" aria-label="播放时间轴 (快捷键 Space)">▶️</button>
        <input type="range" id="timeline-slider" min="1" max="100" value="1" style="flex:1;" aria-label="时间轴进度" aria-valuemin="1" aria-valuemax="100" aria-valuenow="1">
      </div>
    </div>

    <div class="stat-panel" role="status" aria-label="图统计">
      <div class="stat-item">
        <div class="stat-value" id="stat-nodes">0</div>
        <div class="stat-label">网络节点</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-edges">0</div>
        <div class="stat-label">关联边缘</div>
      </div>
    </div>

    <div class="input-group">
      <input id="s" type="text" placeholder="起点 ID" aria-label="起始节点 ID">
      <span style="color:#555" aria-hidden="true">➔</span>
      <input id="t" type="text" placeholder="终点 ID" aria-label="目标节点 ID">
    </div>

    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <button id="btn-path-bfs" title="以最少的人数触达" aria-label="基础追踪 BFS">基础追踪 (BFS)</button>
      <button id="btn-path-dijkstra" title="寻找关系最铁的路径" style="background:linear-gradient(45deg,#aa00ff,#ff00aa);" aria-label="亲密路由 (Dijkstra)">亲密路由</button>
    </div>

    <button id="btn-dfs" title="探测围绕此人的信息闭环" style="background:linear-gradient(45deg,#ff4400,#ff8800); margin-bottom:8px;" aria-label="探测回声室 (DFS)">探测回声室</button>
    <button id="btn-dashboard" style="background:linear-gradient(45deg,#00aa88,#00ccff); margin-bottom:8px;" aria-label="数据洞察面板 (快捷键 S)">数据洞察面板</button>

    <button class="btn-reset" id="btn-reset" aria-label="恢复全景视角 (快捷键 R)">恢复全景视角</button>
    <button class="btn-danger" id="btn-toggle-links" aria-label="隐藏全网连线">隐藏全网连线</button>

    <hr aria-hidden="true">

    <h4 style="color:#00ccff; margin-bottom:0;">物理力场引擎</h4>
    <div class="slider-group">
      <label>星系斥力: <span id="val-repel" aria-live="polite">30</span></label>
      <input type="range" id="ctrl-repel" min="0" max="150" value="30" aria-label="调整星系斥力" aria-valuemin="0" aria-valuemax="150" aria-valuenow="30">
    </div>
    <div class="slider-group">
      <label>社交张力: <span id="val-link" aria-live="polite">30</span></label>
      <input type="range" id="ctrl-link" min="10" max="150" value="30" aria-label="调整社交张力" aria-valuemin="10" aria-valuemax="150" aria-valuenow="30">
    </div>

    <hr aria-hidden="true">

    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <button id="btn-export-json" class="btn-mini-inline" aria-label="导出 JSON 数据">JSON</button>
      <button id="btn-export-csv" class="btn-mini-inline" aria-label="导出 CSV 数据">CSV</button>
      <select id="export-datatype" style="flex:1; background:#111; color:#eee; border:1px solid #333; border-radius:4px; padding:4px; font-size:10px;" aria-label="导出数据类型">
        <option value="pagerank">PageRank</option>
        <option value="community">Community</option>
        <option value="betweenness">Betweenness</option>
        <option value="kcore">K-Core</option>
        <option value="clustering_coeff">Clustering</option>
      </select>
    </div>

    <h4 style="color:#00ccff;">分析指标切换</h4>
    <div style="display:flex; gap:6px; margin-bottom:6px;">
      <select id="ranking-metric" style="flex:1; background:#111; color:#eee; border:1px solid #333; border-radius:4px; padding:4px; font-size:10px;" aria-label="选择排行指标">
        <option value="pagerank">PageRank 影响力</option>
        <option value="betweenness">Betweenness 中介</option>
        <option value="kcore">K-Core 核心度</option>
        <option value="clustering">聚类系数</option>
      </select>
    </div>

    <div id="rank-list" role="list" aria-label="排行榜">
      <div style="color:#666; text-align:center; margin-top:10px; font-size:12px;">等待载入...</div>
    </div>
  </nav>

  <!-- 主画布 (main content) -->
  <main id="main-content">
    <div id="graph" role="img" aria-label="社交网络三维力导向图。加载后将显示节点和边。"></div>
  </main>

  <!-- 路径 HUD -->
  <aside id="path-hud" aria-live="polite" aria-label="路径追踪结果"></aside>

  <!-- 雷达面板 (右侧滑入) -->
  <aside id="radar-panel" aria-label="人脉雷达探测面板"></aside>

  <!-- 统计仪表板 -->
  <section id="stats-dashboard" style="display:none;" role="dialog" aria-modal="true" aria-label="数据洞察面板">
    <div class="dash-header">
      <h3>数据洞察面板</h3>
      <button id="btn-close-dash" class="btn-close" aria-label="关闭仪表板">✕</button>
    </div>
    <div class="chart-grid">
      <div class="chart-card">
        <canvas id="chart-degree" role="img" aria-label="度数分布柱状图"></canvas>
      </div>
      <div class="chart-card">
        <canvas id="chart-community" role="img" aria-label="社区分布环形图"></canvas>
      </div>
      <div class="chart-card">
        <canvas id="chart-pagerank-bar" role="img" aria-label="PageRank 影响力排行榜"></canvas>
      </div>
      <div class="chart-card">
        <canvas id="chart-timing" role="img" aria-label="算法性能对比图"></canvas>
      </div>
    </div>
    <div id="global-stats" style="padding:12px; color:#aaa; font-size:11px; border-top:1px solid rgba(255,255,255,0.1); text-align:center;" aria-live="polite"></div>
  </section>

  <!-- 图例面板 -->
  <aside id="legend-panel" style="display:none;" aria-label="社区图例">
    <h4>社区图例</h4>
    <div id="legend-list"></div>
  </aside>

  <!-- Toast 容器 -->
  <div id="toast-container" aria-live="polite" aria-relevant="additions"></div>

  <!-- 快捷键提示 -->
  <div id="shortcuts-hint" style="position:fixed; bottom:10px; left:10px; color:#555; font-size:10px; z-index:100;" aria-label="快捷键提示">按 H 显示快捷键</div>

  <!-- ES6 模块入口 -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
